<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/ui/icon-192.png">
<link rel="icon" href="assets/ui/icon-192.png">
<title>월하무쌍 테스트 빌드</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;width:100%;position:fixed;overscroll-behavior:none;background:#05060f;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;touch-action:none}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;transform-origin:0 0;overflow:hidden;--sw:1vw;--sh:1vh;--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px)}
canvas{display:block;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(2,3,18,.62) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#fff}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
.pl{position:absolute;left:max(14px,var(--safeL));top:10px;display:flex;gap:10px;align-items:center}
.face{width:58px;height:58px;border:2px solid #e9c873;border-radius:10px;background:#111 center/cover;box-shadow:0 0 0 2px #0008,0 4px 10px #000a;transform:rotate(-3deg)}
.bars{width:min(calc(var(--sw)*34),300px)}
.nm{font-weight:800;font-size:15px;letter-spacing:.5px;text-shadow:0 2px 3px #000,0 0 6px #000}
.nm small{font-weight:600;opacity:.75;margin-left:6px;font-size:11px}
.bar{position:relative;height:13px;margin-top:4px;background:#0009;border:1px solid #fff5;border-radius:3px;overflow:hidden;transform:skewX(-14deg)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transition:transform .12s linear}
#hp i{background:linear-gradient(#8dff9a,#1fae4c)}
#hp.low i{background:linear-gradient(#ffb18d,#e0352b)}
.bar.g{height:8px}
#gauge i{background:linear-gradient(#ffe9a6,#f0a020)}
#gauge.full i{background:linear-gradient(#fff,#ffd24a);animation:pulse .5s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
.tr{position:absolute;right:max(14px,var(--safeR));top:10px;text-align:right;text-shadow:0 2px 3px #000,0 0 6px #000}
.tr .st{font-size:13px;font-weight:700;color:#e9d9a8}
.tr .sc{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
#boss{position:absolute;left:50%;top:14px;width:min(calc(var(--sw)*40),420px);transform:translateX(-50%);display:none;text-align:center}
#boss .nm{color:#d9b6ff}
#boss .bar{height:11px}
#bosshp i{background:linear-gradient(#e2a6ff,#7a2fd0)}
#combo{position:absolute;right:max(18px,var(--safeR));top:74px;font-weight:900;font-style:italic;font-size:34px;color:#ffd54a;text-shadow:0 3px 0 #7a2a00,0 0 12px #f80;opacity:0;transform-origin:right center}
#combo small{font-size:15px;margin-left:4px;color:#fff}
#go{position:absolute;right:8%;top:40%;font-weight:900;font-size:42px;font-style:italic;color:#fff;text-shadow:0 0 14px #ffb300,0 3px 0 #a04a00;display:none;animation:go .5s infinite alternate}
@keyframes go{from{transform:translateX(0)}to{transform:translateX(18px)}}
#msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-weight:900;font-size:min(calc(var(--sw)*8),56px);letter-spacing:4px;text-shadow:0 0 18px #6cf,0 4px 0 #024;opacity:0;white-space:nowrap}
.dn{position:absolute;font-weight:900;font-style:italic;font-size:22px;color:#fff;text-shadow:0 2px 0 #a03000,0 0 8px #f80;animation:dn .65s ease-out forwards;pointer-events:none;white-space:nowrap}
.dn.big{font-size:36px;color:#ffe14a}
@keyframes dn{0%{transform:translate(-50%,0) scale(1.8);opacity:1}22%{transform:translate(-50%,-14px) scale(1)}100%{transform:translate(-50%,-58px) scale(1);opacity:0}}
/* touch controls */
#touch{position:absolute;inset:0;display:none}
#joyzone{position:absolute;left:0;bottom:0;width:46%;height:72%}
#joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid #fff4;background:radial-gradient(#fff1,#fff0);left:110px;top:calc(100% - 110px);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(#fffc,#aab6);box-shadow:0 2px 8px #000a}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;text-shadow:0 2px 2px #000;border:2px solid #fff7;box-shadow:0 4px 12px #000a, inset 0 0 18px #fff3}
.btn:active,.btn.on{transform:scale(.92);filter:brightness(1.4)}
#btnA{right:max(26px,var(--safeR));bottom:30px;width:96px;height:96px;font-size:20px;background:radial-gradient(circle at 35% 30%,#ff9a6a,#c02a1a)}
#btnS{right:calc(max(26px,var(--safeR)) + 104px);bottom:86px;width:76px;height:76px;font-size:16px;background:radial-gradient(circle at 35% 30%,#8a8a8a,#3a3a3a);opacity:.55}
#btnS.ready{background:radial-gradient(circle at 35% 30%,#fff3a0,#f0a000);opacity:1;animation:pulse .5s infinite alternate;color:#3a1a00;text-shadow:none}
#btnJ{right:calc(max(26px,var(--safeR)) + 106px);bottom:8px;width:72px;height:72px;font-size:16px;background:radial-gradient(circle at 35% 30%,#8ad0ff,#1a5fc0)}
#mute{pointer-events:auto;display:inline-block;margin-top:3px;padding:2px 9px;font-size:11px;font-weight:700;border:1px solid #fff6;border-radius:999px;background:#0008;cursor:pointer}
/* cut-in */
#cutin{position:absolute;inset:0;display:none;overflow:hidden;background:rgba(2,3,16,.62)}
#cutin .band{position:absolute;left:-12%;width:124%;top:22%;height:48%;transform:rotate(-6deg) translateX(-110%);overflow:hidden;border-top:4px solid #f3d27a;border-bottom:4px solid #f3d27a;box-shadow:0 0 40px #000,0 0 0 2px #000 inset;background:#06081c}
#cutin.on .band{animation:bandin 1.25s cubic-bezier(.1,.9,.2,1) forwards}
@keyframes bandin{0%{transform:rotate(-6deg) translateX(-110%)}16%{transform:rotate(-6deg) translateX(0)}86%{transform:rotate(-6deg) translateX(2.5%);opacity:1}100%{transform:rotate(-6deg) translateX(40%);opacity:0}}
#cutin .img{position:absolute;inset:-18% -4%;background:#000 30% 42%/cover no-repeat;transform:rotate(6deg) scale(1.02)}
#cutin.on .img{animation:imgdrift 1.25s linear forwards}
@keyframes imgdrift{from{transform:rotate(6deg) scale(1.1) translateX(-3%)}to{transform:rotate(6deg) scale(1.02) translateX(1%)}}
#cutin .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.10) 22px 24px);mix-blend-mode:screen;animation:lines .25s linear infinite}
@keyframes lines{from{background-position:0 0}to{background-position:0 24px}}
#cutin .skill{position:absolute;right:17%;top:7%;height:86%;opacity:0;filter:drop-shadow(0 0 12px #000)}
#cutin.on .skill{animation:skillin 1.25s ease-out forwards}
@keyframes skillin{0%,14%{opacity:0;transform:rotate(6deg) scale(2.2)}26%{opacity:1;transform:rotate(6deg) scale(1)}88%{opacity:1;transform:rotate(6deg) scale(1.04)}100%{opacity:0;transform:rotate(6deg) scale(1.2)}}
#cutin .quote{position:absolute;left:9%;top:71%;font-size:min(calc(var(--sw)*3.4),24px);font-weight:900;text-shadow:0 2px 0 #000,0 0 10px #000;opacity:0;transform:rotate(-6deg)}
#cutin .quote b{font-size:1.25em;margin-right:8px}
#cutin.on .quote{animation:quotein 1.25s ease-out forwards}
@keyframes quotein{0%,18%{opacity:0;transform:rotate(-6deg) translateX(-30px)}30%,88%{opacity:1;transform:rotate(-6deg) translateX(0)}100%{opacity:0}}
/* panels */
.panel{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(3,4,20,.25),rgba(3,4,20,.78));text-align:center;padding:10px}
#title{display:flex}
#logo{height:min(calc(var(--sh)*34),260px);max-width:calc(var(--sw)*72);object-fit:contain;margin-top:calc(var(--sh)*-1);filter:drop-shadow(0 0 22px #f5c66055)}
.sub{font-size:clamp(10px,calc(var(--sh)*3),13px);letter-spacing:6px;color:#d8c9a0;margin:-4px 0 calc(var(--sh)*2.2);text-shadow:0 2px 4px #000}
.cards{display:flex;gap:min(calc(var(--sw)*4),28px);margin-top:2px}
.card{pointer-events:auto;width:min(calc(var(--sw)*30),250px);padding:8px 10px 9px;border:2px solid #e9c87399;border-radius:14px;background:linear-gradient(#141a3acc,#070916e6);box-shadow:0 10px 30px #000c;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover,.card:active{transform:translateY(-4px) scale(1.03);border-color:#ffe29a}
.card .pf{height:min(calc(var(--sh)*24),150px);border-radius:9px;background:#000 center 30%/cover;border:1px solid #fff3}
.card h3{margin:5px 0 1px;font-size:clamp(14px,calc(var(--sh)*4.4),20px);letter-spacing:2px}
.card p{margin:0;font-size:clamp(9px,calc(var(--sh)*2.8),12px);color:#c9d2ee;line-height:1.4}
.hint{margin-top:calc(var(--sh)*2.2);font-size:clamp(9px,calc(var(--sh)*2.6),12px);color:#aeb8d8;text-shadow:0 1px 2px #000}
.big{font-size:min(calc(var(--sw)*9),64px);font-weight:900;letter-spacing:6px;text-shadow:0 0 22px #fc6,0 5px 0 #5a2a00}
#over .big{text-shadow:0 0 22px #f44,0 5px 0 #400}
.res{font-size:16px;margin:10px 0 18px;line-height:1.8;color:#e8e2cc}
.pbtn{pointer-events:auto;display:inline-block;margin:0 6px;padding:11px 24px;border-radius:999px;border:2px solid #e9c873;background:#1a1f45;font-weight:800;font-size:15px;color:#fff;cursor:pointer}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#05060f;font-size:18px;font-weight:800;z-index:9;text-align:center;line-height:1.7}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05060f;z-index:8;font-weight:800;letter-spacing:3px;color:#d8c9a0}
#fps{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff8;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div id="flash"></div>
  <div id="hud">
    <div class="pl"><div class="face" id="face"></div><div class="bars"><div class="nm" id="pname"></div><div class="bar" id="hp"><i></i></div><div class="bar g" id="gauge"><i></i></div></div></div>
    <div class="tr"><div class="st" id="stname">제1막 흑랑 고개</div><div class="sc" id="score">000000</div><div id="mute">소리 켬</div></div>
    <div id="boss"><div class="nm">흑랑채 두목 · 흑랑</div><div class="bar" id="bosshp"><i></i></div></div>
    <div id="combo"></div>
    <div id="go">GO ▶</div>
    <div id="msg"></div>
  </div>
  <div id="touch">
    <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
    <div class="btn" id="btnS">필살</div>
    <div class="btn" id="btnJ">점프</div>
    <div class="btn" id="btnA">공격</div>
  </div>
  <div id="cutin"><div class="band"><div class="img"></div><div class="lines"></div><img class="skill" alt=""></div><div class="quote"></div></div>
  <div class="panel" id="title">
    <img id="logo" src="assets/ui/logo_title.webp" alt="월하무쌍">
    <div class="sub">달빛 아래 흑랑채를 베어라</div>
    <div class="cards">
      <div class="card" data-hero="h1_mujin"><div class="pf" style="background-image:url(assets/ui/cutin_h1_mujin.jpg);background-position:42% 40%"></div><h3>무진</h3><p>환도 · 화염<br>빠른 연타, 필살 화룡참</p></div>
      <div class="card" data-hero="h2_seolhwa"><div class="pf" style="background-image:url(assets/ui/cutin_h2_seolhwa.jpg);background-position:45% 35%"></div><h3>설화</h3><p>월아창 · 빙월<br>긴 사거리, 필살 빙월창</p></div>
    </div>
    <div class="hint" id="hint">PC: 방향키/WASD 이동(두 번 누르면 달리기) · J 공격 · K 필살 · 스페이스 점프 &nbsp;|&nbsp; 모바일: 스틱 끝까지 밀면 달리기 · 달리며 공격 = 돌진 베기</div>
  </div>
  <div class="panel" id="clear"><div class="big">STAGE CLEAR</div><div class="res" id="clearres"></div><div><span class="pbtn" data-act="retry">다시하기</span><span class="pbtn" data-act="title">캐릭터 선택</span></div></div>
  <div class="panel" id="over"><div class="big">GAME OVER</div><div class="res">흑랑채의 밤은 아직 끝나지 않았다.</div><div><span class="pbtn" data-act="retry">다시하기</span><span class="pbtn" data-act="title">캐릭터 선택</span></div></div>
  <div id="fps"></div>
</div>
<div id="loading">불러오는 중…</div>
<div id="rotate">화면을 가로로 돌려 주세요</div>
<script type="module" src="game.js"></script>
</body>
</html>
